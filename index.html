          </div>
          <div class="field">
            <label for="bk-guests" data-i18n="booking.guests"></label>
            <div class="stepper" data-stepper="guests">
              <button type="button" class="stepper__btn" data-dir="-1" aria-label="−">−</button>

              <button type="button" class="stepper__btn" data-dir="1" aria-label="+">+</button>

            <div><span class="contacts__label" data-i18n="contacts.addressLabel"></span><span class="contacts__value" data-address></span></div>
          </li>
          <li>
            <span class="contacts__ic"><svg class="ic"><use href="#i-phone"/></svg></span>
            <div><span class="contacts__label" data-i18n="contacts.phoneLabel"></span>
              <a class="contacts__value" data-phone-primary href="#"></a>
              <a class="contacts__value" data-phone-secondary href="#"></a>
            </div>
          </li>
          <li>
            <span class="contacts__ic"><svg class="ic"><use href="#i-clock"/></svg></span>
            <div><span class="contacts__label" data-i18n="contacts.hoursLabel"></span><span class="contacts__value" data-hours></span></div>
          </li>
        </ul>

        <div class="contacts__actions">
          <a class="btn btn--primary" data-route target="_blank" rel="noopener"><svg class="ic"><use href="#i-pin"/></svg><span data-i18n="contacts.route"></span></a>
          <a class="btn btn--whatsapp" data-wa><svg class="ic"><use href="#i-whatsapp"/></svg><span data-i18n="contacts.write"></span></a>
          <a class="btn btn--telegram" data-tg><svg class="ic"><use href="#i-telegram"/></svg><span data-i18n="contacts.write"></span></a>
        </div>

        <div class="contacts__social">
          <span data-i18n="contacts.follow"></span>
          <a data-social-ig target="_blank" rel="noopener" aria-label="Instagram"><svg class="ic"><use href="#i-instagram"/></svg></a>
          <a data-social-tt target="_blank" rel="noopener" aria-label="TikTok"><svg class="ic"><use href="#i-tiktok"/></svg></a>
        </div>
      </div>

      <div class="contacts__map reveal">
        <iframe data-map title="Pepo's Sauna на карте" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
      </div>
    </div>
  </section>
</main>

<!-- ======================= FOOTER ======================= -->
<footer class="footer">
  <div class="container footer__inner">
    <div class="footer__brand">
      <img src="assets/img/logo.jpg" alt="Pepo’s Sauna" width="48" height="48">
      <div>
        <strong>Pepo’s Sauna</strong>
        <span data-i18n="footer.tagline"></span>
      </div>
    </div>
    <div class="footer__meta">
      <span data-address></span>
      <a data-phone-primary href="#"></a>
    </div>
  </div>
  <div class="footer__bottom container">
    <span>© <span id="year"></span> Pepo’s Sauna. <span data-i18n="footer.rights"></span></span>
    <span data-i18n="footer.made"></span>
  </div>
</footer>

<!-- ======================= FLOATING BUTTONS ======================= -->
<div class="fab">
  <a class="fab__btn fab__btn--wa" data-wa aria-label="WhatsApp"><svg class="ic"><use href="#i-whatsapp"/></svg></a>
  <a class="fab__btn fab__btn--tg" data-tg aria-label="Telegram"><svg class="ic"><use href="#i-telegram"/></svg></a>
  <a class="fab__btn fab__btn--call" data-call aria-label="Call"><svg class="ic"><use href="#i-phone"/></svg></a>
  <a href="#booking" class="fab__btn fab__btn--book" data-i18n="float.book"></a>
</div>
<button class="to-top" id="toTop" aria-label="Up"><svg class="ic"><use href="#i-up"/></svg></button>

<!-- ======================= LIGHTBOX ======================= -->
<div class="lightbox" id="lightbox" aria-hidden="true" role="dialog" aria-modal="true">
  <button class="lightbox__close" id="lbClose" aria-label="Close">&times;</button>
  <button class="lightbox__nav lightbox__nav--prev" id="lbPrev" aria-label="Previous">‹</button>
  <img class="lightbox__img" id="lbImg" alt="">
  <button class="lightbox__nav lightbox__nav--next" id="lbNext" aria-label="Next">›</button>
</div>
